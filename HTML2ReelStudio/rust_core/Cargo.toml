[package]
name = "html2reel_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "html2reel_core"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
bindgen = ["uniffi/cli"]

[dependencies]
uniffi = "0.33.0"
symphonia = { version = "0.6.1", default-features = false, features = ["opt-simd", "aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
rubato = "5.1.0"
audioadapter = "5.0.0"
audioadapter-buffers = "5.2.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.14"
