<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="video-duration" content="10" />
  <meta name="video-resolution" content="1080x1920" />
  <meta name="video-fps" content="30" />
  <title>कर्म ही पहचान है — Hindi Reel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #070913;
      color: #F8FAFC;
      font-family: 'Noto Sans Devanagari', sans-serif;
    }
    .stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      background: radial-gradient(circle at 50% 35%, #1E2448 0%, #0D1020 55%, #060810 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 96px;
      text-align: center;
    }
    canvas#particles {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      pointer-events: none;
    }
    .badge {
      position: relative;
      z-index: 2;
      font-family: 'Playfair Display', serif;
      letter-spacing: 6px;
      font-size: 28px;
      text-transform: uppercase;
      color: #38BDF8;
      padding: 14px 32px;
      border: 1.5px solid rgba(56, 189, 248, 0.45);
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.55);
      margin-bottom: 56px;
      opacity: 0;
      transform: translateY(30px);
    }
    .headline {
      position: relative;
      z-index: 2;
      font-size: 92px;
      font-weight: 700;
      line-height: 1.32;
      background: linear-gradient(135deg, #F8FAFC 10%, #A5B4FC 55%, #FB7185 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 48px;
      opacity: 0;
      transform: scale(0.92);
    }
    .divider {
      position: relative;
      z-index: 2;
      width: 0px;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(90deg, #22D3EE, #6366F1, #FB923C);
      margin-bottom: 48px;
    }
    .subtext {
      position: relative;
      z-index: 2;
      font-size: 44px;
      font-weight: 500;
      line-height: 1.55;
      color: #CBD5E1;
      max-width: 820px;
      opacity: 0;
      transform: translateY(24px);
    }
    .footer-tag {
      position: absolute;
      bottom: 130px;
      z-index: 2;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 34px;
      color: #94A3B8;
      opacity: 0;
    }
    .hud {
      position: absolute;
      top: 40px;
      right: 40px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.72);
      color: #38BDF8;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 24px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="particles" width="1080" height="1920"></canvas>
    <div class="badge" id="badge">HTML2REEL STUDIO</div>
    <h1 class="headline" id="headline">सपने वो नहीं जो नींद में आएँ,<br>सपने वो हैं जो सोने न दें।</h1>
    <div class="divider" id="divider"></div>
    <p class="subtext" id="subtext">हर छोटा कदम, हर रात की मेहनत,<br>एक दिन आपकी पहचान बनती है।</p>
    <div class="footer-tag" id="footer">— Keep Building, Frame by Frame</div>
    <div class="hud" id="hud">PREVIEW HUD · Press H</div>
  </div>

  <script>
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    const badge = document.getElementById('badge');
    const headline = document.getElementById('headline');
    const divider = document.getElementById('divider');
    const subtext = document.getElementById('subtext');
    const footer = document.getElementById('footer');
    const hud = document.getElementById('hud');

    // Deterministic seeded PRNG so particles never drift between runs
    function mulberry32(a) {
      return function() {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(42);
    const stars = Array.from({ length: 64 }, () => ({
      x: rand() * 1080,
      y: rand() * 1920,
      r: 2 + rand() * 5,
      speedY: 40 + rand() * 90,
      phase: rand() * Math.PI * 2,
      hue: rand() > 0.5 ? '56, 189, 248' : '251, 113, 133'
    }));

    function clamp01(v) { return Math.max(0, Math.min(1, v)); }
    function easeOutCubic(t) { return 1 - Math.pow(1 - clamp01(t), 3); }

    function renderAt(t) {
      ctx.clearRect(0, 0, 1080, 1920);
      for (const s of stars) {
        const y = (s.y - t * s.speedY + 1920 * 4) % 1920;
        const alpha = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(t * 2.2 + s.phase));
        ctx.beginPath();
        ctx.arc(s.x, y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${s.hue}, ${alpha.toFixed(3)})`;
        ctx.fill();
      }

      const b = easeOutCubic((t - 0.2) / 0.8);
      badge.style.opacity = b;
      badge.style.transform = `translateY(${(1 - b) * 36}px)`;

      const h = easeOutCubic((t - 0.8) / 1.1);
      headline.style.opacity = h;
      headline.style.transform = `scale(${0.92 + 0.08 * h})`;

      const d = easeOutCubic((t - 1.8) / 0.9);
      divider.style.width = `${340 * d}px`;

      const sub = easeOutCubic((t - 2.4) / 1.0);
      subtext.style.opacity = sub;
      subtext.style.transform = `translateY(${(1 - sub) * 28}px)`;

      const f = easeOutCubic((t - 3.6) / 1.0);
      footer.style.opacity = f;

      if (hud) hud.textContent = `t = ${t.toFixed(2)}s`;
    }

    let start = null;
    function loop(now) {
      if (start === null) start = now;
      const t = ((now - start) / 1000) % 10;
      renderAt(t);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
